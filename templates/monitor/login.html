{% extends "base.html" %}

{% block title %}Login | System Monitor{% endblock %}

{% block content %}
<div class="auth-shell">
  <section class="panel-card auth-card p-4">
    <p class="eyebrow mb-2">Protected monitor</p>
    <h1 class="h3 mb-3">Sign in</h1>
    <form method="post" class="vstack gap-3">
      {% csrf_token %}
      {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
      <div>
        <label class="form-label" for="{{ form.username.id_for_label }}">Username</label>
        <input type="text" name="{{ form.username.html_name }}" autofocus autocapitalize="none" autocomplete="username" maxlength="150" class="form-control" required id="{{ form.username.id_for_label }}">
      </div>
      <div>
        <label class="form-label" for="{{ form.password.id_for_label }}">Password</label>
        <div class="input-group">
          <input type="password" name="{{ form.password.html_name }}" autocomplete="current-password" class="form-control" required id="{{ form.password.id_for_label }}">
          <button type="button" class="btn btn-outline-light" data-password-toggle data-target-id="{{ form.password.id_for_label }}" aria-label="Show password"><i class="bi bi-eye"></i></button>
        </div>
      </div>
      {% if form.errors %}
        <div class="alert alert-danger mb-0">Invalid username or password.</div>
      {% endif %}
      <button type="submit" class="btn btn-accent">Login</button>
    </form>
  </section>
</div>
{% endblock %}

{% block scripts %}
<script>
  document.querySelectorAll("[data-password-toggle]").forEach((button) => {
    button.addEventListener("click", () => {
      const input = document.getElementById(button.dataset.targetId);
      const icon = button.querySelector("i");
      if (!input) return;
      const showing = input.type === "text";
      input.type = showing ? "password" : "text";
      if (icon) icon.className = showing ? "bi bi-eye" : "bi bi-eye-slash";
    });
  });
</script>
{% endblock %}
