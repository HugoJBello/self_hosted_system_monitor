services:
  system_monitor_web:
    build: .
    container_name: system_monitor_web
    restart: unless-stopped
    pid: host
    privileged: true
    ports:
      - "8012:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      RUN_STARTUP_TASKS: "true"
      DJANGO_SECRET_KEY: "dev-unsafe-secret-key"
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "*"
      DJANGO_CSRF_TRUST_ANY_ORIGIN: "True"
      DJANGO_CSRF_TRUSTED_ORIGINS: "https://*.hjbello.org,https://api-android18.hjbello.org,https://api-yamcha.hjbello.org,http://localhost,http://127.0.0.1,http://localhost:8012,http://127.0.0.1:8012"
      DJANGO_DB_PATH: "/app/data/db.sqlite3"
      APP_SUBPATH: "${APP_SUBPATH:-/system_monitor}"
      SAMPLER_DEFAULT_INTERVAL: "60"
      MONITOR_ROOT_PATH: "/hostfs"
      MONITOR_PROCFS_PATH: "/hostfs/proc"
      GUNICORN_TIMEOUT_SECONDS: "960"
      WEB_TERMINAL_IDLE_TIMEOUT_SECONDS: "600"
      DJANGO_DATA_UPLOAD_MAX_MEMORY_SIZE: "10737418240"
      DJANGO_FILE_UPLOAD_MAX_MEMORY_SIZE: "2097152"
    volumes:
      - ./data:/app/data
      - /:/hostfs

  system_monitor_sampler:
    build: .
    container_name: system_monitor_sampler
    restart: unless-stopped
    command: ["python", "manage.py", "run_sampler"]
    environment:
      RUN_STARTUP_TASKS: "false"
      DJANGO_SECRET_KEY: "dev-unsafe-secret-key"
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "*"
      DJANGO_CSRF_TRUST_ANY_ORIGIN: "True"
      DJANGO_CSRF_TRUSTED_ORIGINS: "https://*.hjbello.org,https://api-android18.hjbello.org,https://api-yamcha.hjbello.org,http://localhost,http://127.0.0.1,http://localhost:8012,http://127.0.0.1:8012"
      DJANGO_DB_PATH: "/app/data/db.sqlite3"
      APP_SUBPATH: "${APP_SUBPATH:-/system_monitor}"
      SAMPLER_DEFAULT_INTERVAL: "60"
      MONITOR_ROOT_PATH: "/hostfs"
      MONITOR_PROCFS_PATH: "/hostfs/proc"
      DJANGO_DATA_UPLOAD_MAX_MEMORY_SIZE: "10737418240"
      DJANGO_FILE_UPLOAD_MAX_MEMORY_SIZE: "2097152"
    volumes:
      - ./data:/app/data
      - /:/hostfs:ro
    depends_on:
      system_monitor_web:
        condition: service_healthy

  system_monitor_backup_scheduler:
    build: .
    container_name: system_monitor_backup_scheduler
    restart: unless-stopped
    pid: host
    privileged: true
    command: ["python", "manage.py", "run_backup_scheduler"]
    environment:
      RUN_STARTUP_TASKS: "false"
      DJANGO_SECRET_KEY: "dev-unsafe-secret-key"
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "*"
      DJANGO_CSRF_TRUST_ANY_ORIGIN: "True"
      DJANGO_CSRF_TRUSTED_ORIGINS: "https://*.hjbello.org,https://api-android18.hjbello.org,https://api-yamcha.hjbello.org,http://localhost,http://127.0.0.1,http://localhost:8012,http://127.0.0.1:8012"
      DJANGO_DB_PATH: "/app/data/db.sqlite3"
      APP_SUBPATH: "${APP_SUBPATH:-/system_monitor}"
      SAMPLER_DEFAULT_INTERVAL: "60"
      BACKUP_SCHEDULER_POLL_SECONDS: "15"
      MONITOR_ROOT_PATH: "/hostfs"
      MONITOR_PROCFS_PATH: "/hostfs/proc"
      DJANGO_DATA_UPLOAD_MAX_MEMORY_SIZE: "10737418240"
      DJANGO_FILE_UPLOAD_MAX_MEMORY_SIZE: "2097152"
    volumes:
      - ./data:/app/data
      - /:/hostfs
    depends_on:
      system_monitor_web:
        condition: service_healthy
