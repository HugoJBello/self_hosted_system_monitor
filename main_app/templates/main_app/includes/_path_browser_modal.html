<div class="modal fade" id="{{ modal_id }}" tabindex="-1" aria-labelledby="{{ modal_id }}Label" aria-hidden="true" data-path-browser-modal data-tree-url="{{ tree_url }}">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content backup-modal-shell">
      <div class="modal-header border-secondary-subtle">
        <div>
          <p class="eyebrow mb-1">Host folder browser</p>
          <h2 class="h4 mb-0" id="{{ modal_id }}Label">{{ title|default:"Pick a folder" }}</h2>
        </div>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="path-browser-create-panel mb-3" data-path-browser-create-panel>
          <div class="path-browser-current">
            <span class="mounted-device-label">Current folder</span>
            <strong data-path-browser-current-path>{% if browser_roots %}{{ browser_roots.0.path }}{% else %}/{% endif %}</strong>
          </div>
          <form class="path-browser-create-form" data-path-browser-create-form>
            <label class="form-label" for="{{ modal_id }}NewFolder">New folder</label>
            <div class="input-group flex-wrap backup-source-group">
              <input id="{{ modal_id }}NewFolder" type="text" class="form-control" name="folder_name" autocomplete="off" placeholder="Folder name" data-path-browser-folder-name>
              <button type="submit" class="btn btn-outline-light"><i class="bi bi-folder-plus"></i> Create</button>
            </div>
            <div class="form-text text-secondary">The folder will be created inside the current folder shown above.</div>
            <div class="path-browser-create-message" data-path-browser-create-message></div>
          </form>
        </div>
        <div class="backup-browser" data-path-browser>
          {% for root in browser_roots %}
            <div class="backup-browser-node{% if root.is_mounted %} is-mounted-path{% endif %}" data-path="{{ root.path }}">
              <button type="button" class="backup-browser-toggle" data-path="{{ root.path }}" aria-label="Expand {{ root.name }}">
                <i class="bi bi-chevron-right"></i>
              </button>
              <button type="button" class="backup-browser-select" data-path="{{ root.path }}">
                <i class="bi bi-folder2"></i>
                <span>{{ root.name }}</span>
                {% if root.is_mounted %}<span class="path-browser-mounted-badge">Mounted</span>{% endif %}
              </button>
              <div class="backup-browser-children"></div>
            </div>
          {% endfor %}
        </div>
      </div>
    </div>
  </div>
</div>
